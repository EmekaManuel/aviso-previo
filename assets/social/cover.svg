<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000">
  <defs>
    <pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16263B"/><stop offset="1" stop-color="#0B1522"/></linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#fade)"/>
  <rect width="1500" height="1000" fill="url(#g)"/>

  <!-- lockup -->
  <g transform="translate(110 110) scale(0.9)">
    <rect width="96" height="96" rx="22" fill="#F4F1EA"/>
    <path d="M27 71 48 25 69 71" fill="none" stroke="#101C2C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34.5 57h27" fill="none" stroke="#0B8F82" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="25" r="6.5" fill="#E09A1A" stroke="#F4F1EA" stroke-width="3"/>
  </g>
  <text x="216" y="172" font-family="'Source Serif 4',Georgia,serif" font-size="46" font-weight="600" fill="#F4F1EA" letter-spacing="-0.6">Aviso Previo</text>

  <!-- headline -->
  <text font-family="'Source Serif 4',Georgia,serif" font-weight="600" fill="#F4F1EA" letter-spacing="-2">
    <tspan x="110" y="420" font-size="104">Ship on the date</tspan>
    <tspan x="110" y="535" font-size="104">your contracts allow.</tspan>
  </text>
  <text x="110" y="625" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="32" fill="#F4F1EA" fill-opacity=".72">Subprocessor notice governance for Jira and Confluence.</text>

  <!-- timeline -->
  <g transform="translate(110 760)">
    <line x1="0" y1="40" x2="1280" y2="40" stroke="#F4F1EA" stroke-opacity=".18" stroke-width="2"/>
    <rect x="0" y="28" width="900" height="24" rx="12" fill="#3CCFBF" fill-opacity=".22"/>
    <rect x="0" y="28" width="900" height="24" rx="12" fill="none" stroke="#3CCFBF" stroke-width="2"/>
    <circle cx="0" cy="40" r="11" fill="#3CCFBF"/>
    <circle cx="900" cy="40" r="15" fill="#F2B544" stroke="#0B1522" stroke-width="6"/>
    <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#F4F1EA">
      <text x="0" y="104" fill-opacity=".6" letter-spacing="2" font-size="19">TICKET OPENED</text>
      <text x="0" y="136" font-weight="600">ENG-142 · Glimpse</text>
      <text x="450" y="14" text-anchor="middle" fill="#3CCFBF" letter-spacing="2" font-size="19">60-DAY NOTICE WINDOW</text>
      <text x="900" y="104" text-anchor="middle" fill-opacity=".6" letter-spacing="2" font-size="19">EARLIEST GO-LIVE</text>
      <text x="900" y="136" text-anchor="middle" font-weight="600">19 January 2027</text>
    </g>
  </g>
</svg>
