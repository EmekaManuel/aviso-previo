modules:
  jira:issueGlance:
    - key: aviso-previo-issue-glance
      title: Aviso Previo
      label: Aviso Previo
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
  jira:issuePanel:
    - key: aviso-previo-issue-panel
      title: Aviso Previo
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    - key: aviso-previo-issue-context
      title: Aviso Previo
      label: Aviso Previo
      resource: main
      resolver:
        function: resolver
  jira:adminPage:
    - key: aviso-previo-admin-page
      title: Aviso Previo Admin
      resource: admin
      resolver:
        function: resolver
  jira:workflowValidator:
    - key: aviso-previo-release-validator
      name: Aviso Previo Subprocessor Hold
      description: Blocks deployment transitions before customer DPA notice windows expire
      function: release-validator-func
  rovo:agent:
    - key: aviso-previo-agent
      name: Aviso Previo
      description: Answers what customer DPAs promise about new subprocessors. Checks notice periods and region limits, quotes the exact clause, and opens privacy requests.
      prompt: >
        You are Aviso Previo, a subprocessor compliance assistant for Ayo Payroll's privacy counsel and engineers.
        Your job is to say what the customer data processing agreements (DPAs) commit the company to when a vendor is added or moved, using only your tools.
        Rules: always use a tool to get contract facts and never answer notice periods, dates or clauses from memory.
        Quote clauses exactly as the tool returns them. Report dates exactly as the tool computes them and never do date arithmetic yourself.
        If a tool says a clause is unclear or a term is not confirmed by counsel, say so plainly and do not guess a number.
        If a tool returns an error, such as an empty register, relay its message in full, including where to load the register. When asked about a Jira issue that changes a vendor, check the vendor first, then offer to open a privacy request.
        Only open a privacy request when the person asks for one. End any answer about a contract with: Aviso Previo summarizes your contracts. It is not legal advice.
      conversationStarters:
        - What would adding Glimpse commit us to?
        - What does the Nordic Logistics DPA say about subprocessors?
        - Which customers forbid processing outside the EU?
        - Open a privacy request for ENG-2
      actions:
        - check-subprocessor-commitments
        - explain-customer-term
        - open-privacy-notice-request
  graph:connector:
    - key: aviso-previo-contracts
      name: Aviso Previo Contracts
      icons:
        light: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
        dark: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      objectTypes:
        - atlassian:document
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: graph-connection-func
  rovo:mcp:
    - key: aviso-previo-mcp
      name: Aviso Previo Compliance Tools
      tools:
        - check-subprocessor-commitments
        - explain-customer-term
        - open-privacy-notice-request
  action:
    - key: check-subprocessor-commitments
      name: Check Subprocessor Commitments
      function: check-subprocessor-func
      actionVerb: GET
      description: Checks customer DPAs for notice periods, objection windows, termination rights, location conflicts, and calculates earliest permitted deployment date for a subprocessor.
      inputs:
        vendor:
          title: Vendor Name
          type: string
          required: true
          description: Name of the third-party subprocessor (e.g. Glimpse, RelayPost, ErrorSentry).
        hostingLocation:
          title: Hosting Location
          type: string
          required: false
          description: Geographic location where the vendor hosts customer data (e.g. United States, EU).
    - key: explain-customer-term
      name: Explain Customer Contract Term
      function: explain-term-func
      actionVerb: GET
      description: Returns verbatim clause quote, notice days, unit, objection window, and termination remedies for a specific customer DPA.
      inputs:
        customerName:
          title: Customer Name
          type: string
          required: true
          description: Customer name or contract ID (e.g. Nordic Logistics AS, Caledonia Finance, CUST-001).
    - key: open-privacy-notice-request
      name: Open Privacy Notice Request
      function: open-notice-func
      actionVerb: CREATE
      description: Creates a formal privacy notice request ticket and drafts customer notification text for Privacy Counsel.
      inputs:
        issueKey:
          title: Jira Issue Key
          type: string
          required: true
          description: The Jira ticket introducing the subprocessor change (e.g. ENG-142).
        vendor:
          title: Vendor Name
          type: string
          required: true
          description: Name of the subprocessor.
  llm:
    - key: aviso-previo-llm
      model:
        - claude
  function:
    - key: resolver
      handler: index.handler
    - key: release-validator-func
      handler: index.validateTransition
    - key: check-subprocessor-func
      handler: index.checkSubprocessorAction
    - key: explain-term-func
      handler: index.explainTermAction
    - key: open-notice-func
      handler: index.openNoticeAction
    - key: graph-connection-func
      handler: index.onConnectionChange
resources:
  - key: main
    path: admin-ui/dist-panel
  - key: admin
    path: admin-ui/dist
app:
  id: ari:cloud:ecosystem::app/2bd1fd88-a709-4b4c-bf65-fcdac4a24bf8
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
    - write:object:jira
    - read:object:jira
    - delete:object:jira
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - write:space:confluence
    - storage:app
